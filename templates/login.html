<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 · 인천대학교 근무 대시보드</title><link rel="stylesheet" href="{{ url_for('dashboard.static', filename='glass.css') }}"></head>
<body class="auth-page"><main class="auth-card"><img class="auth-logo" src="{{ url_for('dashboard.static', filename='inu-logo.png') }}" alt="인천대학교 공식 로고"><p class="eyebrow">LIBRARY STAFF WORKSPACE</p><h1>다시 만나 반가워요.</h1><p class="auth-description">연속간행물실 근무 대시보드에 로그인하세요.</p>{% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}<form method="post" action="{{ url_for('dashboard.login') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><label>아이디<input name="username" required maxlength="32" autocomplete="username" autofocus></label><label>비밀번호<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label><button class="auth-submit" type="submit">로그인</button></form><p class="auth-note">계정이 필요하면 근로 관리자에게 문의해주세요.</p></main></body></html>
